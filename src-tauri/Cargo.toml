[package]
name = "hours-cal"
version = "1.1.5"
description = "מערכת לניהול נוכחות וחישוב שעות עבודה ושעות נוספות"
edition = "2021"

[lib]
name = "hours_cal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
hourscal-license = { path = "../crates/hourscal-license" }
calamine = { version = "0.36", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
