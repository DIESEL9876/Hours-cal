[package]
name = "hourscal-license-manager"
version = "1.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "OWNER-ONLY core of Hours-Cal License Manager: protected signing key, issuance, registry, encrypted backups. Never shipped with Hours-Cal."

[dependencies]
hourscal-license = { path = "../hourscal-license" }
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["zeroize_derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
