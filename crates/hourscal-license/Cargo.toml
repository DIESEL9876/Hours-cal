[package]
name = "hourscal-license"
version = "1.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Hours-Cal offline licensing, legal acceptance and read-only recovery core"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# Same version as src-tauri (one bundled SQLite in the app binary).
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
# (uses only the crate's own deps)
