name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - name: Unit tests (engine, storage, input parsing) under three host time zones
        run: |
          npx vitest run
          TZ=Asia/Jerusalem npx vitest run
          TZ=America/New_York npx vitest run
      - name: End-to-end tests (browser build)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Rust storage tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          npm run build
          npm run test:rust

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx vitest run
      - name: Build Windows installers (NSIS + MSI)
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: hours-cal-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/hours-cal.exe
