[package]
name = "hourscal-license-manager-app"
version = "1.0.0"
description = "Hours-Cal License Manager (OWNER ONLY)"
edition = "2021"
authors = ["Ilay Nagar"]

[lib]
name = "hourscal_license_manager_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hourscal-license-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
hourscal-license = { path = "../../crates/hourscal-license" }
hourscal-license-manager = { path = "../../crates/hourscal-license-manager" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
